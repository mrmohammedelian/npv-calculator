<title>NPV Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: verdict band on top, two input panels (company | client) side by side, results strip, then merged schedule ledger. RTL or LTR via <html dir>. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e9eeec; --line:#d5dddb;
  --fg:#17211f; --muted:#5b6b67; --accent:#1d5c55; --accent-soft:#dcebe8;
  --good:#1e7a46; --good-soft:#dff2e6; --warn:#a86500; --warn-soft:#fbeed6; --bad:#b4322a; --bad-soft:#f9e1de;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --font-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#172120; --sunk:#1d2a28; --line:#2c3b38;
  --fg:#e6eeec; --muted:#93a6a1; --accent:#5cbcae; --accent-soft:#1c3633;
  --good:#5ccf8a; --good-soft:#163022; --warn:#f0b452; --warn-soft:#352a14; --bad:#f2786d; --bad-soft:#3a1b18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172120; --sunk:#1d2a28; --line:#2c3b38;
  --fg:#e6eeec; --muted:#93a6a1; --accent:#5cbcae; --accent-soft:#1c3633;
  --good:#5ccf8a; --good-soft:#163022; --warn:#f0b452; --warn-soft:#352a14; --bad:#f2786d; --bad-soft:#3a1b18; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.08rem;font-weight:600}
.num,input[data-num],td,.big{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;gap:10px}
.meta label{display:grid;gap:2px;font-size:.78rem;color:var(--muted)}
.meta input{width:170px}

/* verdict */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;border-inline-start:6px solid var(--state,var(--accent))}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;padding:6px 14px;border-radius:999px;background:var(--state-soft);color:var(--state)}
.vmain{display:grid;gap:6px;justify-items:start}
.big{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1.1}
.vsub{color:var(--muted);font-size:.9rem}
.gauge{display:grid;gap:6px;min-width:0}
.gbar{position:relative;height:14px;border-radius:7px;overflow:hidden;display:flex;direction:ltr}
.gbar span{height:100%}
.gmark{position:absolute;top:-4px;width:4px;height:22px;border-radius:2px;background:var(--fg);transform:translateX(-2px);transition:left .25s}
.gwrap{position:relative;direction:ltr}
.gticks{position:relative;height:16px;font-size:.72rem;color:var(--muted);direction:ltr}
.gticks i{position:absolute;font-style:normal;transform:translateX(-50%)}
.glegend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.glegend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}

/* panels */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:14px;align-content:start;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tag{font-size:.75rem;letter-spacing:.02em;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted)}
.field small{color:var(--muted);font-size:.75rem}
input,select{font:inherit;font-size:15px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:42px;width:100%;min-width:0}
/* every field: label on top, box at the bottom, so boxes in a row line up whatever the label length */
.field{align-content:end}
.field.span2,.note.span2{grid-column:1 / -1}
.startsel{display:grid;gap:3px;font-size:.75rem;color:var(--muted);min-width:0}
.startsel select{height:36px;font-size:.85rem;width:auto;max-width:100%}
/* two boxes that fill each other in, with "or" between them */
.field.orpair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.orpair .sub2{display:grid;gap:4px;min-width:0}
.orpair .sub2>span{font-size:.8rem;color:var(--muted)}
.orsep{height:42px;display:flex;align-items:center;font-size:.8rem;color:var(--muted);padding-inline:2px}
.dpdual .sub>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input[data-num]{direction:ltr;text-align:right}
/* numbers are written left-to-right but line up under their label on the page's reading side */
[dir=rtl] .ltr,[dir=rtl] input[data-num]{text-align:right}
[dir=ltr] .ltr,[dir=ltr] input[data-num]{text-align:left}
[dir=ltr] body{font-size:14.5px}
.topbar{display:flex;justify-content:flex-start;direction:ltr;margin-bottom:-10px}
.langsw{direction:ltr}
.datecol{display:grid;gap:6px;align-content:start}
.xlbox{display:grid;gap:3px;justify-items:start;max-width:240px;margin-top:4px}
.xlbtn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.xlbtn:hover{background:var(--accent-soft)}
#xlMsg{font-size:.75rem;color:var(--muted)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.kv div{display:grid;gap:2px;min-width:0}
.kv span{font-size:.74rem;color:var(--muted)}
.kv .re b{color:var(--accent)}
.kv b small{font-weight:500;color:var(--muted);font-size:.78em}
.kv b{font-family:var(--font-display);font-weight:600;font-size:1rem;overflow-wrap:anywhere}

.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font:inherit;font-size:.85rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.custom{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:1.5rem minmax(0,.7fr) minmax(0,1.25fr) minmax(0,1.25fr) minmax(0,.7fr) 2rem;gap:6px;align-items:center}
.crow input[type=date]{padding-inline:6px}
.crow .mhint{font-size:.7rem;color:var(--muted)}
.crow.head>span{text-align:center}
.crow .idx{color:var(--muted);font-size:.8rem;text-align:center}
.crow .date{font-size:.72rem;color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;width:2rem;height:2rem;cursor:pointer;font-size:1rem;line-height:1}
.icon-btn:hover{color:var(--bad);border-color:var(--bad)}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--accent)}
.note{font-size:.8rem;padding:8px 10px;border-radius:8px}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--good-soft);color:var(--good)}

/* results */
.results{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.results>div{background:var(--surface);padding:14px 16px;display:grid;gap:4px;align-content:start;min-width:0}
.results span{font-size:.78rem;color:var(--muted)}
.results b{font-family:var(--font-display);font-size:1.15rem;font-weight:600;overflow-wrap:anywhere}
.results small{color:var(--muted);font-size:.76rem}
.results.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dlvwrap{display:grid;gap:8px}
.dlvwrap h2{font-size:1rem}
.dlvhint{color:var(--muted);font-size:.85rem;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:12px 16px}
.pctwrap{position:relative;display:block;min-width:0}
.pctwrap input{padding-right:24px;text-align:right!important}
.pctwrap::after{content:'%';position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:.9em}
.dpdual{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:6px}
.dpdual .sub{display:grid;gap:2px;font-size:.7rem;color:var(--muted);min-width:0}
.meta .dual{display:flex;gap:6px;align-items:end}
.meta .dual .orsep{height:42px;display:flex;align-items:center;font-size:.8rem;color:var(--muted);padding-inline:2px}
.meta .dual .sub{display:grid;gap:2px;font-size:.7rem;color:var(--muted)}
.meta .dual input[data-num]{width:84px}
.meta .dual input[type=date]{width:150px}
.kv.dlvkv{background:var(--warn-soft)}
.kv.dlvkv span{color:var(--warn)}
tr.dlv td{background:var(--warn-soft);color:var(--warn);font-weight:600;text-align:center;font-family:var(--font-display)}

.suggest{background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px}
.suggest .row{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.sitem{display:grid;gap:2px;min-width:0}
.sitem span{font-size:.78rem;color:var(--muted)}
.sitem b{font-family:var(--font-display);font-size:1.15rem}
.verdictb b{font-size:1.25rem;padding:4px 14px;border-radius:999px}
.verdictb.is-ok b{color:var(--good);background:var(--good-soft)}
.verdictb.is-bad b{color:var(--bad);background:var(--bad-soft)}
.sitem button{justify-self:start;margin-top:4px;font-size:.8rem;padding:4px 10px}
.target{display:flex;gap:8px;align-items:center;font-size:.85rem}
.target select{width:auto}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#copyMsg{font-size:.85rem;color:var(--good)}
textarea#copyFallback{width:100%;min-height:150px;font:inherit;font-size:.85rem;background:var(--sunk);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}

/* ledger */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ledger .lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.tscroll{overflow-x:auto;max-height:560px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.86rem}
th,td{padding:7px 12px;text-align:start;white-space:nowrap;border-bottom:1px solid var(--line)}
thead th{position:sticky;top:0;background:var(--sunk);font-weight:600;font-size:.78rem;color:var(--muted);z-index:1}
thead tr.grp th{font-family:var(--font-display);color:var(--fg);font-size:.82rem}
th.c,td.c{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.zero{color:var(--muted);opacity:.5}
td.neg{color:var(--bad)} td.pos{color:var(--good)}
tfoot td{font-weight:700;background:var(--sunk);position:sticky;bottom:0}

@media (max-width:860px){
  .panels{grid-template-columns:1fr}
  .results{grid-template-columns:repeat(2,minmax(0,1fr))}
  .verdict{grid-template-columns:1fr}
}
@media (max-width:440px){
  .results.r3{grid-template-columns:1fr}
  .crow{grid-template-columns:1.4rem minmax(0,.8fr) minmax(0,1.4fr) 2rem}
  .crow .amt{grid-column:2}
  .crow.head{display:none}
  .fields{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr 1fr}
  .big{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="topbar"><div class="seg langsw" role="group" aria-label="Language / اللغة">
        <button type="button" id="langEn" lang="en" aria-pressed="true">English</button>
        <button type="button" id="langAr" lang="ar" aria-pressed="false">عربي</button>
      </div></div>
  <header>
    <div>
      <h1 data-t="title">NPV Calculator</h1>

        <div class="xlbox"><button type="button" class="xlbtn" id="xlBtn"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 2v8m0 0L4.5 6.5M8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="xlBtn"></span></button><span id="xlMsg" role="status"></span></div></div>

  </section>

  <div class="panels">
    <section class="panel" aria-labelledby="compH">

        <label class="field" for="area"><span data-t="area"></span><input id="area" type="text" inputmode="decimal" autocomplete="off" data-num step="1" value="71"></label>

        <label class="field" for="cYears"><span data-t="cYears"></span><input id="cYears" type="text" inputmode="decimal" autocomplete="off" data-num step="1" min="0" value="8"></label>

          <select id="cFreq"><option value="1" data-t="f1"></option><option value="3" data-t="f3" selected></option><option value="6" data-t="f6"></option><option value="12" data-t="f12"></option></select></label>

        <div><span data-t="m2"></span><b class="ltr" id="cM2Out">—</b></div>
      </div>
      <div class="kv dlvkv" id="cDlvBox" hidden>

        <div><span data-t="dlvRem"></span><b class="ltr" id="cDlvR">—</b></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="cliH">
      <div class="phead"><h2 id="cliH" data-t="cliH"></h2>

          <button type="button" id="modeCu" aria-pressed="false" data-t="modeCu"></button>
        </div>
      </div>
      <div class="fields">
        <label class="field span2" for="kPrice"><span data-t="kPrice"></span><input id="kPrice" type="text" inputmode="decimal" autocomplete="off" data-num data-money step="1000" value="5400000"></label>
        <div class="field span2 orpair"><label for="kDp" class="sub2"><span data-t="dpAmtL"></span><input id="kDp" type="text" inputmode="decimal" autocomplete="off" data-num data-money step="1000" value="3000000"></label><span class="orsep" data-t="orWord"></span><label for="kDpPctIn" class="sub2"><span data-t="dpPctL"></span><span class="pctwrap"><input id="kDpPctIn" type="text" inputmode="decimal" autocomplete="off" data-num step="1" value=""></span></label></div>
        <label class="field eqOnly" for="kCount"><span data-t="kCount"></span><input id="kCount" type="text" inputmode="decimal" autocomplete="off" data-num step="1" min="0" value="3"></label>
        <label class="field eqOnly" for="kFreq"><span data-t="freq"></span>
          <select id="kFreq"><option value="1" data-t="f1"></option><option value="3" data-t="f3"></option><option value="6" data-t="f6"></option><option value="12" data-t="f12" selected></option></select></label>
        <label class="field eqOnly" for="kStart"><span data-t="startL"></span>
          <select id="kStart"><option value="std"></option><option value="dlv" data-t="startDlv"></option><option value="own" data-t="startOwn"></option></select></label>

(function(){
const $=id=>document.getElementById(id);
const fmt=(n,d=0)=>isFinite(n)?Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const sgn=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n));
const pct=(n,d=1)=>isFinite(n)?(n<0?'−':'')+Math.abs(n).toFixed(d)+'%':'—';
const num=x=>parseFloat(String(x).replace(/,/g,''));
const val=id=>{const v=num($(id).value);return isFinite(v)?v:0};

/* ---------- number boxes: accept Arabic-Indic digits, show Latin ---------- */
const AR_DIG='٠١٢٣٤٥٦٧٨٩', FA_DIG='۰۱۲۳۴۵۶۷۸۹';
const normNum=str=>{let o='';for(const ch of str){let k=AR_DIG.indexOf(ch);if(k<0)k=FA_DIG.indexOf(ch);
  if(k>=0)o+=k;else if(ch==='٫'||ch==='.')o+='.';else if(/[0-9]/.test(ch))o+=ch;else if(ch==='-'||ch==='−')o+=o===''?'-':'';}
  const p=o.split('.');return p.length>2?p[0]+'.'+p.slice(1).join(''):o;};
// runs in the capture phase, so every other listener already sees Latin digits
document.addEventListener('input',e=>{const el=e.target;if(!el.matches||!el.matches('input[data-num]'))return;
  const v=el.value,caret=el.selectionStart??v.length,before=normNum(v.slice(0,caret));
  let clean=normNum(v);
  if(el.hasAttribute('data-money'))clean=groupNum(clean);
  if(clean!==v){el.value=clean;
    // put the caret back after the same number of digits it followed before
    let pos=0,seen=0;while(pos<clean.length&&seen<before.length){if(clean[pos]!==',')seen++;pos++;}
    try{el.setSelectionRange(pos,pos);}catch(_){}}},true);
// up/down arrow keys add or subtract the box's step from the current value
document.addEventListener('keydown',e=>{const el=e.target;if(!el.matches||!el.matches('input[data-num]'))return;
  if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;e.preventDefault();
  const st=parseFloat(el.getAttribute('step'))||1,mn=el.hasAttribute('min')?parseFloat(el.getAttribute('min')):-Infinity;
  let v=(num(el.value)||0)+(e.key==='ArrowUp'?st:-st);v=Math.max(mn,Math.round(v*100)/100);
  el.value=String(v);el.dispatchEvent(new Event('input',{bubbles:true}));});

// 7939241 -> 7,939,241 (keeps a trailing "." or decimals while typing)
function groupNum(str){const m=/^(-?)(\d*)(\.\d*)?$/.exec(String(str).replace(/,/g,''));if(!m)return str;
  return m[1]+m[2].replace(/\B(?=(\d{3})+(?!\d))/g,',')+(m[3]||'');}
function formatMoneyBoxes(){document.querySelectorAll('input[data-money]').forEach(el=>{if(el!==document.activeElement&&el.value!==''){const g=groupNum(normNum(el.value));if(g!==el.value)el.value=g;}});}

// Excel EDATE
function edate(d,m){const y=d.getFullYear(),mo=d.getMonth()+m,day=d.getDate();
  const last=new Date(y,mo+1,0).getDate();return new Date(y,mo,Math.min(day,last));}
// Excel DAYS360, US (NASD) method
function days360(s,e){
  let sd=s.getDate(),sm=s.getMonth(),sy=s.getFullYear(),ed=e.getDate(),em=e.getMonth(),ey=e.getFullYear();
  const lastS=new Date(sy,sm+1,0).getDate(), lastE=new Date(ey,em+1,0).getDate();
  if(sd===lastS) sd=30;
  if(ed===lastE){ if(sd<30){ ed=1; em+=1; } else ed=30; }
  return (ey-sy)*360+(em-sm)*30+(ed-sd);
}
const fmtDate=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

// company rules kept on "start over": discount rate, DP %, term, frequencies, loss limit
const RULES={cStart:'std',kStart:'std',cDpPct:15,cYears:8,cFreq:'3',rate:15,kFreq:'12',target:'2.5'};
let mode='eq', custom=[], payments=[], cPayments=[], delivery=null, cFirst=null, kFirst=null;
const STORE='npv-calc-v1';

function base(){const v=$('baseDate').value; if(v){const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d);} const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}

const parseD=v=>{const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d);};
const isoD=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
// an item is due on its typed date if it has one, otherwise N months after the base date
const itemDue=(b,c)=>c.date?parseD(c.date):edate(b,Math.max(0,Math.round(c.m||0)));
const monthsOf=(b,d)=>Math.round(days360(b,d)/30*10)/10;
function factor(b,m,r,dueAt){const due=dueAt||edate(b,m);const yrs=-days360(due,b)/360;return {due,yrs,f:Math.pow(1+r,-yrs)};}

function companySched(){
  const P=val('cPrice'),dp=cDpMode==='amt'?val('cDp'):P*val('cDpPct')/100,f=+$('cFreq').value,n=Math.round(val('cYears')*12/f);
  const b0=base();const pays=cPayments.filter(p=>itemAmt(p,P)).map(p=>({m:p.date?monthsOf(b0,parseD(p.date)):Math.max(0,Math.round(p.m)),due:itemDue(b0,p),amt:itemAmt(p,P),pct:p.pct,pay:true}));
  const paySum=pays.reduce((s,p)=>s+p.amt,0), rem=P-dp-paySum;
  const rows=[{m:0,amt:dp},...pays];const inst=n>0?rem/n:0;
  // installments start either one period after the contract (standard) or on the handover date
  const sv=$('cStart').value,anchor=sv==='dlv'?delivery:sv==='own'?cFirst:null;
  if(anchor){const d0=itemDue(b0,anchor),m0=anchor.date?monthsOf(b0,d0):anchor.m;
    for(let i=1;i<=n;i++) rows.push({m:m0+(i-1)*f,due:edate(d0,(i-1)*f),amt:inst});}
  else for(let i=1;i<=n;i++) rows.push({m:i*f,amt:inst});
  return {P,dp,n,inst,rows,pays,paySum,rem};
}
function clientEqualRows(){
  const P=val('kPrice'),dp=val('kDp'),f=+$('kFreq').value,n=Math.max(0,Math.round(val('kCount')));
  const b0=base();const pays=payments.filter(p=>itemAmt(p,P)).map(p=>({m:p.date?monthsOf(b0,parseD(p.date)):Math.max(0,Math.round(p.m)),due:itemDue(b0,p),amt:itemAmt(p,P),pct:p.pct,pay:true,date:p.date}));
  const paySum=pays.reduce((s,p)=>s+p.amt,0), rem=P-dp-paySum;
  const inst=n>0?rem/n:0;const rows=[];
  // same choice as the company plan: standard, on the handover date, or a picked first date
  const sv=$('kStart').value,anchor=sv==='dlv'?delivery:sv==='own'?kFirst:null;
  if(anchor){const d0=itemDue(b0,anchor),m0=anchor.date?monthsOf(b0,d0):anchor.m;
    for(let i=1;i<=n;i++) rows.push({m:m0+(i-1)*f,due:edate(d0,(i-1)*f),amt:inst});}
  else for(let i=1;i<=n;i++) rows.push({m:i*f,amt:inst});
  return {P,dp,n,f,inst,rows,pays,paySum,rem};
}
function clientSched(){
  const P=val('kPrice'),dp=val('kDp');
  if(mode==='eq'){const e=clientEqualRows();return {...e,rows:[{m:0,amt:dp},...e.pays,...e.rows]};}
  const rows=[{m:0,amt:dp},...custom.filter(c=>itemAmt(c,P)).map(c=>({m:c.date?monthsOf(base(),parseD(c.date)):Math.max(0,Math.round(c.m)),due:itemDue(base(),c),amt:itemAmt(c,P)}))];
  return {P,dp,n:custom.length,rows};
}

function pvOf(rows,b,r){let s=0;for(const x of rows){x.fx=factor(b,x.m,r,x.due);x.pv=x.amt*x.fx.f;s+=x.pv;}return s;}

// a payment row holds either an amount or a % of the unit price (pct wins, so it follows price changes)
const itemAmt=(c,P)=>c.pct!=null?P*c.pct/100:(c.amt||0);
const pctOf=(a,P)=>P>0?Math.round(a/P*10000)/100:'';
function renderList(list,boxId,headId,px,delKey,rerender,priceId){
  const b=base();const box=$(boxId);box.innerHTML='';if(headId)$(headId).hidden=!list.length;
  list.forEach((c,i)=>{
    const row=document.createElement('div');row.className='crow';
    const due=itemDue(b,c);
    row.innerHTML=`<span class="idx">${i+1}</span>
      <input type="text" inputmode="decimal" autocomplete="off" data-num min="0" step="1" id="${px}m${i}" value="${c.date?monthsOf(b,due):c.m}" placeholder="${T('monthsShort')}" aria-label="${T('afterMonths')}">
      <input type="date" id="${px}d${i}" value="${isoD(due)}" aria-label="${T('payDate')}">
      <input type="text" inputmode="decimal" autocomplete="off" data-num data-money class="amt" step="1000" id="${px}a${i}" value="${groupNum(String(Math.round(itemAmt(c,val(priceId))*100)/100))}" placeholder="${T('amount')}" aria-label="${T('amount')}">
      <span class="pctwrap"><input type="text" inputmode="decimal" autocomplete="off" data-num step="1" id="${px}r${i}" value="${c.pct!=null?c.pct:pctOf(c.amt||0,val(priceId))}" aria-label="%"></span>
      <button type="button" class="icon-btn" aria-label="${T(delKey,i+1)}">×</button>`;
    const mIn=row.querySelector('#'+px+'m'+i), dIn=row.querySelector('#'+px+'d'+i);
    // months typed -> date follows (EDATE from the base date)
    mIn.addEventListener('input',e=>{c.m=Math.max(0,Math.round(parseFloat(e.target.value)||0));delete c.date;dIn.value=isoD(edate(base(),c.m));calc();});
    // date typed -> months follow (DAYS360/30, one decimal)
    dIn.addEventListener('input',e=>{if(!e.target.value)return;c.date=e.target.value;c.m=monthsOf(base(),parseD(c.date));mIn.value=c.m;calc();});
    const aIn=row.querySelector('#'+px+'a'+i), rIn=row.querySelector('#'+px+'r'+i);
    // amount typed -> % follows; % typed -> amount follows
    aIn.addEventListener('input',e=>{c.amt=num(e.target.value)||0;delete c.pct;rIn.value=pctOf(c.amt,val(priceId));calc();});
    rIn.addEventListener('input',e=>{const v=e.target.value;if(v===''){delete c.pct;c.amt=0;aIn.value='';calc();return;}
      c.pct=num(v)||0;c.amt=itemAmt(c,val(priceId));aIn.value=groupNum(String(Math.round(c.amt)));calc();});
    row.querySelector('button').addEventListener('click',()=>{list.splice(i,1);rerender();calc();});
    box.appendChild(row);
  });
}
function renderPays(){renderList(payments,'payRows','payHead','p','delPay',renderPays,'kPrice');renderList(cPayments,'cPayRows','cPayHead','q','delPay',renderPays,'cPrice');}
function renderCustom(){renderList(custom,'customRows',null,'c','delInst',renderCustom,'kPrice');}
// when a price changes, refresh the box that follows (amount for % rows, % for amount rows) without touching what is being typed
function syncListBoxes(){[[payments,'p','kPrice'],[cPayments,'q','cPrice'],[custom,'c','kPrice']].forEach(([list,px,pid])=>{const P=val(pid);
  list.forEach((c,i)=>{const a=$(px+'a'+i),r=$(px+'r'+i);if(!a||!r)return;
    if(c.pct!=null){c.amt=itemAmt(c,P);if(a!==document.activeElement)a.value=groupNum(String(Math.round(c.amt)));}
    else if(r!==document.activeElement)r.value=pctOf(c.amt||0,P);});});}

function setMode(m){
  mode=m;$('modeEq').setAttribute('aria-pressed',m==='eq');$('modeCu').setAttribute('aria-pressed',m==='cu');
  document.querySelectorAll('.eqOnly').forEach(el=>el.hidden=m!=='eq');$('customBox').hidden=m!=='cu';
  if(m==='cu'&&!custom.length){const e=clientEqualRows();custom=[...e.pays,...e.rows].sort((a,b)=>a.m-b.m).map(r=>({m:Math.round(r.m),amt:r.amt,date:r.date||(r.due?isoD(r.due):undefined)}));}
  if(m==='cu') renderCustom();
  renderPays();
  calc();
}

function payNote(el,S,show,noInstKey){
  if(!show){el.hidden=true;return;}
  el.hidden=false;
  if(S.rem<-0.5){el.className='note bad';el.textContent=T('payOver',fmt(-S.rem));}
  else if(S.n===0&&S.rem>=1){el.className='note bad';el.textContent=T(noInstKey,fmt(S.rem));}
  else{el.className='note ok';el.textContent=T('payOk',fmt(S.paySum),fmt(S.rem)+(S.P?' ('+(S.rem/S.P*100).toFixed(1)+'%)':''),S.n?' ÷ '+S.n+' = '+fmt(S.inst):'');}
}

let last=null;
function calc(){
  {const f=+$('cFreq').value;$('cStart').options[0].textContent=T('startStd',f);
   const sv=$('cStart').value;$('cFirstBox').hidden=sv!=='own';
   const need=sv==='dlv'&&!delivery?'startNeedDlv':sv==='own'&&!cFirst?'startNeedOwn':'';
   $('cStartNote').hidden=!need;if(need)$('cStartNote').textContent=T(need);
   const kf=+$('kFreq').value,kv=$('kStart').value;$('kStart').options[0].textContent=T('startStd',kf);
   $('kFirstBox').hidden=mode!=='eq'||kv!=='own';
   const kneed=mode!=='eq'?'':kv==='dlv'&&!delivery?'startNeedDlv':kv==='own'&&!kFirst?'startNeedOwn':'';
   $('kStartNote').hidden=!kneed;if(kneed)$('kStartNote').textContent=T(kneed);}
  syncDp();
  syncCDp();
  syncListBoxes();
  formatMoneyBoxes();
  if(!(val('cPrice')>0&&val('kPrice')>0&&val('area')>0)){
    ['cDpOut','cPayOut','cReOut','kDpOut','kPayOut','kReOut','cInstOut','cM2Out','kInstOut','kM2Out','kLastOut','pvC','pvCs','pvK','pvKs','beP','beM2','beM2s','vDiff'].forEach(i=>$(i).textContent='—');
    const v=$('verdict');v.style.setProperty('--state','var(--muted)');v.style.setProperty('--state-soft','var(--sunk)');
    $('vPill').textContent=T('waiting');
    $('vSub').textContent=T('waitingSub');
    $('gmark').style.left='66.7%';$('gbar').innerHTML='';$('gticks').innerHTML='';
    $('customNote').hidden=true;$('payNote').hidden=true;$('cPayNote').hidden=true;$('dlvRes').hidden=true;$('dlvHint').hidden=false;$('cDlvBox').hidden=true;$('kDlvBox').hidden=true;
    $('sugBody').innerHTML=`<div class="sitem"><span>${T('sugWait')}</span></div>`;
    $('tbody').innerHTML=`<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:24px">${T('ledWait')}</td></tr>`;
    $('tfoot').innerHTML='';$('ledInfo').textContent='—';
    last=null;save();return;
  }
  const b=base(),r=val('rate')/100,area=val('area')||1;
  const C=companySched(),K=clientSched();
  const pvC=pvOf(C.rows,b,r),pvK=pvOf(K.rows,b,r);
  const totK=K.rows.reduce((s,x)=>s+x.amt,0);
  const diff=pvK-pvC, diffPct=K.P?diff/K.P*100:0;
  const beP=K.P-diff, beM2=beP/area, kM2=K.P/area;
  // collected by handover: everything due on or before the handover date
  const dlvD=delivery?itemDue(b,delivery):null;
  let dl=null;
  if(dlvD){const by=rows=>rows.reduce((s,x)=>s+(x.fx.due<=dlvD?x.amt:0),0);
    const cc=by(C.rows),kc=by(K.rows),cp=C.P?cc/C.P*100:0,kp=K.P?kc/K.P*100:0;dl={d:dlvD,cc,kc,cp,kp};
    $('dlvC').textContent=cp.toFixed(1)+'%';$('dlvCs').textContent=fmt(cc)+' · '+T('dlvOn',fmtDate(dlvD));
    $('dlvK').textContent=kp.toFixed(1)+'%';$('dlvKs').textContent=fmt(kc)+' · '+T('dlvOn',fmtDate(dlvD));
    $('cDlvP').textContent=cp.toFixed(1)+'%';$('cDlvA').textContent=fmt(cc);$('cDlvR').textContent=fmt(C.P-cc);
    $('kDlvP').textContent=kp.toFixed(1)+'%';$('kDlvA').textContent=fmt(kc);$('kDlvR').textContent=fmt(K.P-kc);
    const dpp=kp-cp;$('dlvX').textContent=(dpp>0?'+':dpp<0?'−':'')+Math.abs(dpp).toFixed(1)+' '+T('dlvPts');$('dlvXs').textContent=sgn(kc-cc);
  }
  $('dlvRes').hidden=!dlvD;$('dlvHint').hidden=!!dlvD;$('cDlvBox').hidden=!dlvD;$('kDlvBox').hidden=!dlvD;

  // company panel
  // RE = price − down payment − lump payments, shown as amount and % of price; Q = RE ÷ installments
  const amtPct=(a,P)=>{const b=document.createElement('span');b.textContent=fmt(a)+' ';const sm=document.createElement('small');sm.textContent='('+(P?(a/P*100).toFixed(1):'0')+'%)';b.appendChild(sm);return b;};
  const putAP=(id,a,P)=>{const el=$(id);el.textContent='';el.appendChild(amtPct(a,P));};
  putAP('cDpOut',C.dp,C.P);putAP('cPayOut',C.paySum,C.P);putAP('cReOut',C.rem,C.P);
  $('cInstOut').textContent=C.n?fmt(C.inst)+' × '+C.n:'—';$('cM2Out').textContent=fmt(C.P/area);
  putAP('kDpOut',val('kDp'),K.P);
  if(mode==='eq'){putAP('kPayOut',K.paySum,K.P);putAP('kReOut',K.rem,K.P);}else{$('kPayOut').textContent='—';$('kReOut').textContent='—';}
  // client panel
  $('kInstOut').textContent=mode==='eq'?(K.n?fmt(K.inst)+' × '+K.n:'—'):T('nInst',custom.length);
  $('kM2Out').textContent=fmt(kM2);
  const lastRow=K.rows.length>1?K.rows.slice(1).reduce((p,x)=>x.fx.due>p.fx.due?x:p):null;
  $('kLastOut').textContent=lastRow?fmtDate(lastRow.fx.due):T('cash');
  const note=$('customNote');
  if(mode==='cu'){const gap=K.P-totK;note.hidden=false;
    if(Math.abs(gap)<1){note.className='note ok';note.textContent=T('cuOk');}
    else{note.className='note bad';note.textContent=gap>0?T('cuLeft',fmt(gap)):T('cuOver',fmt(-gap));}
  } else note.hidden=true;
  payNote($('cPayNote'),C,cPayments.length||C.rem<0||(C.n===0&&Math.abs(C.rem)>=1),'payNoInstC');
  payNote($('payNote'),K,mode==='eq'&&(payments.length||K.rem<0||(K.n===0&&Math.abs(K.rem)>=1)),'payNoInstK');

  // verdict
  const lossPct=diff<0?-diffPct:0;
  let st,lk;
  if(diff>=0){st='good';lk='profit';}
  else if(lossPct<=2.5){st='good';lk='lossNormal';}
  else if(lossPct<=4.5){st='warn';lk='lossCase';}
  else{st='bad';lk='lossOut';}
  const v=$('verdict');v.style.setProperty('--state',`var(--${st})`);v.style.setProperty('--state-soft',`var(--${st}-soft)`);
  $('vPill').textContent=T(lk)+T('pillSuffix',diff);
  $('vDiff').textContent=sgn(diff)+'  ('+pct(diffPct,2)+')';
  $('vSub').textContent=T('vSub',val('rate'));
  // gauge from -8% (loss) to +4% (profit); LTR scale
  const MIN=-8,MAX=4,span=MAX-MIN,pos=x=>((Math.min(MAX,Math.max(MIN,x))-MIN)/span*100);
  $('gbar').innerHTML=[[MIN,-4.5,'bad'],[-4.5,-2.5,'warn'],[-2.5,MAX,'good']].map(([a,z,c])=>`<span style="width:${(z-a)/span*100}%;background:var(--${c});opacity:.85"></span>`).join('');
  $('gmark').style.left=pos(diffPct)+'%';
  $('gticks').innerHTML=[-8,-4.5,-2.5,0,4].map(t=>`<i style="left:${pos(t)}%">${t>0?'+':''}${t}%</i>`).join('');

  // results
  $('pvC').textContent=fmt(pvC);$('pvCs').textContent=T('discVal')+fmt(C.P-pvC);
  $('pvK').textContent=fmt(pvK);$('pvKs').textContent=T('discVal')+fmt(totK-pvK);
  $('beP').textContent=fmt(beP);
  $('beM2').textContent=fmt(beM2);$('beM2s').textContent=T('m2Diff')+sgn(kM2-beM2);

  // suggestions
  const t=parseFloat($('target').value)/100, sb=$('sugBody');
  const okNow = diff>=0 || lossPct<=t*100+1e-9;
  const status=`<div class="sitem verdictb ${okNow?'is-ok':'is-bad'}"><b>${okNow?T('accepted'):T('outside')}</b></div>`;
  if(mode==='eq'){
    const eq=clientEqualRows();
    let a=0; if(eq.n){let s=0;for(const x of eq.rows) s+=factor(b,x.m,r,x.due).f; a=s/eq.n;}
    const dp=val('kDp'),P=val('kPrice');
    // payments stay fixed; installments absorb whatever is left: PV = dp + Σpay·f + (P−dp−Σpay)·a
    const payAdj=eq.pays.reduce((s,p)=>s+p.amt*(factor(b,p.m,r,p.due).f-a),0);
    const minP = eq.n? (pvC-dp*(1-a)-payAdj)/(a+t) : NaN;
    const rawDp = eq.n? (pvC-P*(a+t)-payAdj)/(1-a) : NaN;
    const minDp = Math.max(0,rawDp);
    const dpFeasible = eq.n && rawDp <= P-eq.paySum;
    sb.innerHTML=status+`
      <div class="sitem"><span>${T('minP')}</span><b class="ltr">${eq.n?fmt(Math.max(minP,dp+eq.paySum)):T('needInst')}</b>
        ${eq.n?`<button type="button" class="btn ghost" id="applyP">${T('applyP')}</button>`:''}</div>
      <div class="sitem"><span>${T('minDp')}</span><b class="ltr">${dpFeasible?fmt(minDp):eq.n?T('impossible'):T('needInst')}</b>
        ${dpFeasible?`<button type="button" class="btn ghost" id="applyDp">${T('applyDp')}</button>`:''}</div>`;
    if(eq.n) $('applyP').onclick=()=>{$('kPrice').value=Math.ceil(Math.max(minP,dp+eq.paySum));calc();};
    if(dpFeasible) $('applyDp').onclick=()=>{dpMode='amt';$('kDp').value=Math.ceil(minDp);calc();};
  } else {
    const need = Math.max(0, -(diff) - t*K.P);
    sb.innerHTML=status+`<div class="sitem"><span>${T('needPv')}</span><b class="ltr">${fmt(need)}</b></div>
      <div class="sitem"><span>${T('autoSug')}</span><b style="font-size:.9rem;font-weight:500">${T('autoSugEq')}</b></div>`;
  }

  // ledger
  const map=new Map();
  for(const x of C.rows){const k=x.fx.due.getTime();const o=map.get(k)||{m:x.m,k};o.ca=(o.ca||0)+x.amt;o.cp=(o.cp||0)+x.pv;o.fx=x.fx;map.set(k,o);}
  for(const x of K.rows){const k=x.fx.due.getTime();const o=map.get(k)||{m:x.m,k};o.ka=(o.ka||0)+x.amt;o.kp=(o.kp||0)+x.pv;o.fx=x.fx;map.set(k,o);}
  const rows=[...map.values()].sort((a,b)=>a.k-b.k);
  let cum=0,html='';
  const cell=(n,cls='')=>`<td class="${cls}${n?'':' zero'}">${n?fmt(n):'—'}</td>`;
  let mk=!dlvD;const marker=()=>`<tr class="dlv"><td colspan="9">${T('dlvRow',fmtDate(dlvD))}</td></tr>`;
  rows.forEach((o,i)=>{if(!mk&&o.fx.due>dlvD){html+=marker();mk=true;}const d=(o.ka||0)-(o.ca||0);cum+=d;
    html+=`<tr><td>${o.k===b.getTime()?'DP':i}</td><td>${fmtDate(o.fx.due)}</td><td>${o.fx.yrs.toFixed(2)}</td>${cell(o.ca)}${cell(o.cp)}${cell(o.ka,'c')}${cell(o.kp,'c')}<td class="${d<0?'neg':d>0?'pos':'zero'}">${d?sgn(d):'—'}</td><td class="${cum<0?'neg':cum>0?'pos':''}">${sgn(cum)}</td></tr>`;});
  if(!mk)html+=marker();
  $('tbody').innerHTML=html;
  $('tfoot').innerHTML=`<td colspan="3">${T('total')}</td><td>${fmt(C.rows.reduce((s,x)=>s+x.amt,0))}</td><td>${fmt(pvC)}</td><td class="c">${fmt(totK)}</td><td class="c">${fmt(pvK)}</td><td></td><td>${sgn(diff)} PV</td>`;
  $('ledInfo').textContent=T('ledInfo',C.rows.length-1,K.rows.length-1);

  last={C,K,pvC,pvK,diff,diffPct,lk,beP,beM2,kM2,area,b,dl};
  save();
}

function summary(){
  const L=last;if(!L)return'';
  const fq={1:T('f1'),3:T('f3'),6:T('f6'),12:T('f12')};
  const payLines=list=>list.map(p=>`${T('sPay')} ${fmtDate(p.due)}: ${fmt(p.amt)}\n`).join('');
  const kLine = mode==='eq' ? payLines(L.K.pays)+(L.K.n?T('sInst',L.K.n,fq[$('kFreq').value],fmt(L.K.inst)):'') : L.K.rows.slice(1).map(x=>`${fmtDate(x.fx.due)}: ${fmt(x.amt)}`).join('\n');
  return `${T('sClient')}: ${$('clientName').value} | ${$('unitLoc').value}
${T('sDate')}: ${fmtDate(L.b)} | ${T('sRate')}: ${val('rate')}%

${T('sComp')}: ${fmt(L.C.P)} (${T('sPerM2')} ${fmt(L.C.P/L.area)})
${T('sDp')} ${fmt(L.C.dp)}
${payLines(L.C.pays)}${L.C.n?T('sInst',L.C.n,fq[$('cFreq').value],fmt(L.C.inst)):''}
${T('sPv')}: ${fmt(L.pvC)}

${T('sOffer')}: ${fmt(L.K.P)} (${T('sPerM2')} ${fmt(L.kM2)})
${T('sDp')} ${fmt(val('kDp'))}
${kLine}
${T('sPv')}: ${fmt(L.pvK)}

${T('sDiff')}: ${sgn(L.diff)} (${pct(L.diffPct,2)}) ← ${T(L.lk)}
${T('sBeP')}: ${fmt(L.beP)} | ${T('sBeM2')}: ${fmt(L.beM2)}${L.dl?`\n${T('sDlv')} (${fmtDate(L.dl.d)}): ${T('thCompany')} ${L.dl.cp.toFixed(1)}% · ${T('thClient')} ${L.dl.kp.toFixed(1)}%`:''}`;
}

const IDS=['clientName','unitLoc','cPrice','area','cDp','cDpPct','cYears','cFreq','cStart','rate','kPrice','kDp','kDpPctIn','kCount','kFreq','kStart','target'];
// client down payment: whichever box was typed last leads; the other one follows (also when the price changes)
let dpMode='amt',cDpMode='pct';
// company down payment works the same way: the box typed last leads
function syncCDp(){const P=val('cPrice'),aIn=$('cDp'),pIn=$('cDpPct');
  if(cDpMode==='amt'){if(pIn!==document.activeElement)pIn.value=(P>0&&aIn.value!=='')?String(Math.round(val('cDp')/P*10000)/100):'';}
  else if(aIn!==document.activeElement)aIn.value=(P>0&&pIn.value!=='')?groupNum(String(Math.round(P*val('cDpPct')/100))):'';}
function syncDp(){const P=val('kPrice'),pIn=$('kDpPctIn');
  if(dpMode==='pct'){if(pIn.value!==''&&P>0)$('kDp').value=String(Math.round(P*val('kDpPctIn')/100));}
  else pIn.value=(P>0&&$('kDp').value!=='')?String(Math.round(val('kDp')/P*10000)/100):'';}
function save(){try{const o={mode,custom,payments,cPayments,lang,langV:2,delivery,dpMode,cDpMode,cFirst,kFirst};IDS.forEach(i=>o[i]=$(i).value);localStorage.setItem(STORE,JSON.stringify(o));}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem(STORE)||'null');if(!o)return false;IDS.forEach(i=>{if(o[i]!=null)$(i).value=o[i];});custom=o.custom||[];payments=o.payments||[];cPayments=o.cPayments||[];delivery=o.delivery||null;cFirst=o.cFirst||null;kFirst=o.kFirst||null;dpMode=o.dpMode==='pct'?'pct':'amt';cDpMode=o.cDpMode==='amt'?'amt':'pct';mode=o.mode||'eq';if(o.langV===2&&(o.lang==='en'||o.lang==='ar'))lang=o.lang;return true;}catch(e){return false;}}

function setLang(l){lang=l;applyLang();if(mode==='cu')renderCustom();renderPays();calc();$('copyMsg').textContent='';$('copyFallback').hidden=true;}

// init
const todayStr=()=>{const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;};
$('baseDate').value=todayStr();
load();
applyLang();
function syncDlv(){const b=base();
  if(!delivery){$('dlvM').value='';$('dlvD').value='';return;}
  const d=itemDue(b,delivery);$('dlvD').value=isoD(d);$('dlvM').value=delivery.date?monthsOf(b,d):delivery.m;}
$('dlvM').addEventListener('input',e=>{const v=e.target.value;if(v===''||v==='.'){delivery=null;$('dlvD').value='';calc();return;}
  delivery={m:Math.max(0,Math.round(parseFloat(v)||0))};$('dlvD').value=isoD(edate(base(),delivery.m));calc();});
$('dlvD').addEventListener('input',e=>{const v=e.target.value;if(!v){delivery=null;$('dlvM').value='';calc();return;}
  delivery={date:v};$('dlvM').value=monthsOf(base(),parseD(v));calc();});
syncDlv();
// first installment date for the "I pick" option: months or a date, each fills the other
const FIRST={c:{get:()=>cFirst,set:v=>{cFirst=v;}},k:{get:()=>kFirst,set:v=>{kFirst=v;}}};
function syncFirst(){const b=base();Object.entries(FIRST).forEach(([p,st])=>{const F=st.get(),mI=$(p+'FirstM'),dI=$(p+'FirstD');
  if(!F){mI.value='';dI.value='';return;}const d=itemDue(b,F);dI.value=isoD(d);mI.value=F.date?monthsOf(b,d):F.m;});}
Object.entries(FIRST).forEach(([p,st])=>{const mI=$(p+'FirstM'),dI=$(p+'FirstD');
  mI.addEventListener('input',e=>{const v=e.target.value;if(v===''){st.set(null);dI.value='';calc();return;}
    st.set({m:Math.max(0,Math.round(parseFloat(v)||0))});dI.value=isoD(edate(base(),st.get().m));calc();});
  dI.addEventListener('input',e=>{const v=e.target.value;if(!v){st.set(null);mI.value='';calc();return;}
    st.set({date:v});mI.value=monthsOf(base(),parseD(v));calc();});});
syncFirst();
$('langAr').onclick=()=>setLang('ar');$('langEn').onclick=()=>setLang('en');
$('kDp').addEventListener('input',()=>{dpMode='amt';});
$('cDp').addEventListener('input',()=>{cDpMode='amt';});
$('cDpPct').addEventListener('input',()=>{cDpMode='pct';});
$('kDpPctIn').addEventListener('input',()=>{dpMode='pct';});
IDS.concat('baseDate').forEach(i=>$(i).addEventListener('input',()=>{if(i==='baseDate'){if(mode==='cu')renderCustom();renderPays();syncDlv();syncFirst();}calc();}));
$('cAddPay').onclick=()=>{const lastM=cPayments.length?cPayments[cPayments.length-1].m:0;cPayments.push({m:lastM+12,amt:0});renderPays();calc();const el=$('qa'+(cPayments.length-1));if(el)el.focus();};
$('addPay').onclick=()=>{const lastM=payments.length?payments[payments.length-1].m:0;payments.push({m:lastM+12,amt:0});renderPays();calc();const el=$('pa'+(payments.length-1));if(el)el.focus();};
$('modeEq').onclick=()=>setMode('eq');$('modeCu').onclick=()=>setMode('cu');
$('addRow').onclick=()=>{const lastM=custom.length?custom[custom.length-1].m:0;custom.push({m:lastM+12,amt:0});renderCustom();calc();};
$('fillRest').onclick=()=>{if(!custom.length)return;const P=val('kPrice'),tot=val('kDp')+custom.reduce((s,c)=>s+itemAmt(c,P),0),lc=custom[custom.length-1];lc.amt=itemAmt(lc,P)+P-tot;delete lc.pct;renderCustom();calc();};
$('resetBtn').onclick=()=>{dpMode='amt';cDpMode='pct';$('cDp').value='';['clientName','unitLoc','cPrice','area','kPrice','kDp','kDpPctIn','kCount'].forEach(k=>$(k).value='');
  Object.entries(RULES).forEach(([k,v])=>$(k).value=v);
  $('baseDate').value=todayStr();custom=[];payments=[];cPayments=[];delivery=null;cFirst=null;kFirst=null;syncDlv();syncFirst();setMode('eq');$('copyMsg').textContent=T('resetMsg');$('cPrice').focus();};
$('copyBtn').onclick=()=>{const txt=summary();const fb=$('copyFallback');
  const done=()=>{$('copyMsg').textContent=T('copied');fb.hidden=true;};
  const fail=()=>{fb.value=txt;fb.hidden=false;fb.focus();fb.select();$('copyMsg').textContent=T('copyFail');};
  try{navigator.clipboard.writeText(txt).then(done,fail);}catch(e){fail();}};
// ---------- Excel download: fills the Abo Elkher sheet (npv-template.xlsx) with this page's numbers ----------
// Only input cells are written; every formula in the sheet stays, and Excel recalculates on open.
const xlSerial=d=>Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/864e5);
const xmlEsc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// one pass over the sheet: replace each <c r="REF"> listed in edits, keeping its style
function applyCells(xml,edits){
  return xml.replace(/<c r="([A-Z]+\d+)"(\s[^>]*?)?(?:\/>|>[\s\S]*?<\/c>)/g,(whole,ref,attrs)=>{
    if(!edits.has(ref))return whole;const val=edits.get(ref);
    const st=/\ss="(\d+)"/.exec(attrs||'');const sa=st?' s="'+st[1]+'"':'';
    if(val===null||val===undefined||val==='')return '<c r="'+ref+'"'+sa+'/>';
    if(typeof val==='number')return '<c r="'+ref+'"'+sa+'><v>'+(Math.round(val*1e6)/1e6)+'</v></c>';
    if(typeof val==='object'&&val.f)return '<c r="'+ref+'"'+sa+'><f>'+xmlEsc(val.f)+'</f></c>';
    return '<c r="'+ref+'"'+sa+' t="inlineStr"><is><t>'+xmlEsc(val)+'</t></is></c>';});
}
let xlP=null,xlDl=null,xlTpl=null;
async function downloadXlsx(){
  const msg=$('xlMsg');
  if(!last){msg.textContent=T('xlWait');return;}
  // inside Claude the page saves through the downloads capability; on its own (e.g. GitHub Pages) it uses a normal browser download
  const plainDl={save:({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return Promise.resolve({status:'saved'});}};
  xlDl=xlDl||(window.claude&&claude.use?claude.use('downloads').then(d=>d||null):Promise.resolve(plainDl));
  const dl=await xlDl;
  if(!dl||!window.JSZip){msg.textContent=T('xlNA');return;}
  msg.textContent=T('xlWorking');
  try{
    // the Abo Elkher template ships beside the page as base64 text (the host serves text, not .xlsx)
    xlTpl=xlTpl||fetch('npv-template.b64.txt').then(r=>{if(!r.ok)throw new Error('template');return r.text();});
    const zip=await JSZip.loadAsync((await xlTpl).trim(),{base64:true});
    const path='xl/worksheets/sheet1.xml';let x=await zip.file(path).async('string');
    const L=last,calcD=xlSerial(L.b),rate=val('rate')/100,MAXR=125,E=new Map();
    E.set('I3',$('clientName').value||'-');E.set('I4',$('unitLoc').value||'-');
    E.set('I5',L.C.P);E.set('I9',val('area'));E.set('W5',L.K.P);
    E.set('Q2',calcD);E.set('AE2',calcD);
    let over=0;
    // RE (remaining) = unit price − down payment − every lump payment; Q = RE ÷ number of installments;
    // each equal installment points at Q, exactly like the original sheet ($H$10 / $V$10).
    // a down payment or lump payment given as a % is written as price×% so it stays a % in Excel
    const side=(S,equal,amtCol,dateCol,todayCol,rateCol,priceRef,dpPct)=>{
      const dpRow=S.rows[0],r=S.rows.slice().sort((a,b)=>a.fx.due-b.fx.due);over=Math.max(over,r.length);
      const minus=[];
      for(let i=0;i<MAXR;i++){const row=12+i,it=r[i];
        if(!it){E.set(amtCol+row,null);}
        else if(equal&&it!==dpRow&&!it.pay){E.set(amtCol+row,{f:'$'+amtCol+'$10'});}
        else{const pc=it===dpRow?dpPct:it.pct;E.set(amtCol+row,pc!=null&&pc!==''?{f:priceRef+'*'+pc+'%'}:it.amt);if(equal)minus.push(amtCol+row);}
        if(it)E.set(dateCol+row,xlSerial(it.fx.due)); // unused rows keep their EDATE chain
        E.set(todayCol+row,calcD);E.set(rateCol+row,rate);}
      if(equal){E.set(amtCol+'9',{f:priceRef+(minus.length?'-'+minus.join('-'):'')});
        E.set(amtCol+'10',S.n?{f:amtCol+'9/'+S.n}:null);}
      else{E.set(amtCol+'9',S.P-S.rows.reduce((a,x)=>a+x.amt,0));E.set(amtCol+'10',null);}
    };
    side(L.C,true,'H','I','J','M','I5',cDpMode==='pct'?val('cDpPct'):null);side(L.K,mode==='eq','V','W','X','AA','W5',dpMode==='pct'&&$('kDpPctIn').value!==''?val('kDpPctIn'):null);
    zip.file(path,applyCells(x,E));
    // sheet tab: "NPV - <client>" (Excel: max 31 chars, none of []:*?/\, no leading/trailing ')
    const cn=($('clientName').value||'').replace(/[\[\]:*?\/\\]/g,'').replace(/^'+|'+$/g,'').trim();
    // "NPV <client> <today>" or "NPV <today>"; Excel tabs hold 31 chars, so a long client name is cut at a word
    const td=new Date(),dStr=String(td.getDate()).padStart(2,'0')+'-'+String(td.getMonth()+1).padStart(2,'0')+'-'+td.getFullYear();
    const room=31-('NPV  '+dStr).length;
    let cut=cn;if(cut.length>room){cut=cut.slice(0,room);const sp=cut.lastIndexOf(' ');if(sp>0)cut=cut.slice(0,sp);}
    cut=cut.replace(/'+$/,'').trim();
    const tab=cut?'NPV '+cut+' '+dStr:'NPV '+dStr;
    const wbx=await zip.file('xl/workbook.xml').async('string');
    zip.file('xl/workbook.xml',wbx.replace(/<sheet name="[^"]*"/,'<sheet name="'+xmlEsc(tab)+'"'));
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
    // file name: NPV - <client> - <unit> - <today>; any part that is empty is skipped
    const clean=v=>(v||'').trim().replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').slice(0,40).trim();
    const td2=new Date(),dName=String(td2.getDate()).padStart(2,'0')+'-'+String(td2.getMonth()+1).padStart(2,'0')+'-'+td2.getFullYear();
    await dl.save({filename:['NPV',clean($('clientName').value),clean($('unitLoc').value),dName].filter(Boolean).join(' - ')+'.xlsx',data:blob});
    msg.textContent=over>MAXR?T('xlTooMany',over):T('xlSaved');
  }catch(e){const c=e&&e.code;
    msg.textContent=c==='declined'?'':(c==='unavailable'||c==='not_granted'||c==='extension_not_enabled'||c==='host_unavailable'||c==='capability_disabled'||c==='capability_removed')?T('xlNA'):T('xlErr');}
}
$('xlBtn').onclick=downloadXlsx;
setMode(mode);
})();
